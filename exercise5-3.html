<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Contact Us</title>
</head>

<body>
	<h1>Contact Us</h1>
	<form action="https://cs.appstate.edu/jas/hp.php" method="POST">
		<fieldset>
			<legend>Send Us Feedback</legend>
			<label for="emailTo">To:</label>
				<br>
				<input id="emailTo" type="text"
					name="emailTo" value="Acme Corporation" readonly>
			<br>
			<br>
			<label for="emailFrom">Your email address:</label>
				<br>
				<input id="emailFrom" type="email"
					name="emailFrom" required>
			<br>
			<br>
			<label for="emailBody">Message:</label>
			<br>
				<textarea id="emailBody" name="emailBody" 
				rows="5" cols="20" 
				placeholder="Place your message here..."></textarea>
			<br>
			<br>
		</fieldset>

		<fieldset>
			<legend>Survey Questions</legend>
				<label for="referrer">How did you hear about us?</label>
				<br>
				<select id="referrer" name="referrer">
					<option value="google">Google</option>
					<option value="ad">Ad</option> <!-- Was not capital in instructions, but capitalized for consistency-->
					<option value="friend" selected>Friend</option>
					<option value="other">Other</option>
				</select>
				<br>
				<br>
				<label for="newsletter">Would you like to receieve our newsletter?</label>
					<br>
					<input type="checkbox" id="newsletter" name="newsletter" 
					checked>Yes please. Send me the newsletter.
		</fieldset>

		<fieldset>
			<legend>Rate Our Service</legend>
				<label for="rating_1"></label>
					<input id="rating_1" type="radio"
						name="rating" value="1">Very Poor
				<br>
				<label for="rating_2"></label>
					<input id="rating_2" type="radio"
						name="rating" value="2">Poor
				<br>
				<label for="rating_3"></label>
					<input id="rating_3" type="radio"
						name="rating" value="3">Average
				<br>
				<label for="rating_4"></label>
					<input id="rating_4" type="radio"
						name="rating" value="4">Good
				<br>
				<label for="rating_5"></label>
					<input id="rating_5" type="radio"
						name="rating" value="5">Very Good
		</fieldset>
		<input type="submit" value="Send Message">
	</form>

</body>

</html>
