<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Exercise 5</title>
</head>
<body>

	<form method="post" action="https://cs.appstate.edu/jas/hp.php">

		<label for="emailTo">To:</label>
		<input type="text" name="emailTo" id="emailTo" value="cs3440@appstate.edu" readonly size="20"><br>

		<label for="emailFrom">From:</label>
		<input type="email" name="emailFrom" id="emailFrom" required size="20"><br>

		<label for="emailBody">Message:</label>
		<textarea name="emailBody" id="emailBody" cols="20" rows="5" placeholder="Type your message here ..." required></textarea><br>

		<label for="referrer">Referrer:</label>
		<select name="referrer" id="referrer">
			<option value="google" selected>Google</option>
			<option value="ad">Newspaper ad</option>
			<option value="friend">Friend</option>
			<option value="other">Other</option>
		</select>
		<br>

		<label for="newsletter">Newsletter:</label>
		<input type="checkbox" name="newsletter" id="newsletter" checked><br>

		<fieldset>
			<legend>Rating</legend>

			<input type="radio" name="rating" id="rating_1" value="1"> <label for="rating_1">1</label><br>
			<input type="radio" name="rating" id="rating_2" value="2"> <label for="rating_2">2</label><br>
			<input type="radio" name="rating" id="rating_3" value="3"> <label for="rating_3">3</label><br>
			<input type="radio" name="rating" id="rating_4" value="4"> <label for="rating_4">4</label><br>
			<input type="radio" name="rating" id="rating_5" value="5"> <label for="rating_5">5</label><br>

		</fieldset>
	<br>
    <input type="submit" value="Send Message">

	</form>

</body>
</html>
