<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>My Title</title>
</head>

<body>
    <h1>Contact Us</h1>

    <form method="post" action="https://cs.appstate.edu/jas/hp.php">

        <fieldset>
            <legend>
                Send Us Feedback
            </legend>

            <label for="emailTo">To:<br>
                <input type="text" name="emailTo" id="emailTo" value="Acme Corporation" readonly>
            </label>
            <br><br>

            <label for="emailFrom">Your email address:<br>
                <input type="email" name="emailFrom" id="emailFrom" required>
            </label>
            <br><br>

            <label for="emailBody">Message:<br>
                <textarea name="emailBody" id="emailBody" cols="20" rows="5" placeholder="Type your message here ..."
                    required>
                </textarea>
            </label>
        </fieldset>

        <br>

        <fieldset>
            <legend>
                Survey Questions
            </legend>

            <label for="referrer">
                How did you hear about us?
            </label>
            <br>

            <select id="referrer" name="referrer">
                <option value="google">Google</option>
                <option value="ad">Newspaper ad</option>
                <option value="friend">Friend</option>
                <option value="other">Other</option>
            </select>

            <br><br>

            <label for="newsletter">
                Would you like to receive our newsletter?
            </label>
            <br>
            <input type="checkbox" id="newsletter" name="newsletter" checked>
            <label for="newsletter">
                Yes please. Send me the newsletter.
            </label>

        </fieldset>

        <br>

        <fieldset>
            <legend>Rate Our Service</legend>

            <label for="rating_1"> Very Poor</label>
            <input type="radio" id="rating_1" name="rating" value="1">
            <br>

            <label for="rating_2">Poor</label>
            <input type="radio" id="rating_2" name="rating" value="2">
            <br>

            <label for="rating_3">Average</label>
            <input type="radio" id="rating_3" name="rating" value="3">
            <br>

            <label for="rating_4">Good</label>
            <input type="radio" id="rating_4" name="rating" value="4">
            <br>

            <label for="rating_5">Very Good</label>
            <input type="radio" id="rating_5" name="rating" value="5">

        </fieldset>

        <input type="submit" value="Send Message">

    </form>
</body>

</html>
